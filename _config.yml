# ─────────────────────────────────────────────────────────────
#  ANTARES · cabinet of curiosities
#  Jekyll config. GitHub Pages builds this automatically.
#  After editing this file, wait a minute for Pages to rebuild.
# ─────────────────────────────────────────────────────────────

title: Antares
tagline: Per Tenebras, Forma
description: >-
  Portfolio and cabinet of curiosities of Antares (Antares):
  animation, illustration, comics and other strange specimens.
author: Antares
lang: en
timezone: Europe/Madrid
theme: null   # no GitHub theme: the cabinet brings its own furniture

# Where the site lives. If you ever move it to a custom domain or to a
# repo called scorpiidev.github.io, change baseurl to "".
url: "https://scorpiidev.github.io"
baseurl: "/alpha-scorpion"

# ── Contact form ────────────────────────────────────────────
# Get a free access key at https://web3forms.com (type your email, they
# mail you the key). Paste it between the quotes. The key does NOT reveal
# your email address, so it is safe to have here.
web3forms_access_key: "e9e57026-4b1a-4e1e-a4ab-ef92538a4dfb"

# ── Blog (the Field Log) ────────────────────────────────────
permalink: /log/:year/:month/:day/:title/

# ── Gallery (the Hall of Specimens) ─────────────────────────
collections:
  works:
    output: true
    permalink: /specimens/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, room: log }
  - scope: { path: "", type: works }
    values: { layout: specimen, room: specimens }
  - scope: { path: "" }
    values:
      layout: default
      image: /assets/img/brand/og-card.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: log/feed.xml

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - tools
