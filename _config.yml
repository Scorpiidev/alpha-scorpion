# ─────────────────────────────────────────────────────────────
#  ANTARES · comics & illustration
#  Jekyll config. GitHub Pages builds this automatically.
#  After editing this file, wait a minute for Pages to rebuild.
# ─────────────────────────────────────────────────────────────

title: Antares
tagline: Per Tenebras, Forma
description: >-
  Antares, comic artist and illustrator based in Spain.
  Pencils, inks and colour for sequential art, plus illustration and character design.
author: Antares
lang: en
timezone: Europe/Madrid
theme: null

# Where the site lives. If you ever move it to a custom domain or to a
# repo called scorpiidev.github.io, change baseurl to "".
url: "https://scorpiidev.github.io"
baseurl: "/alpha-scorpion"

# ── Contact form ────────────────────────────────────────────
# Web3Forms access key. The key does NOT reveal your email address.
web3forms_access_key: "e9e57026-4b1a-4e1e-a4ab-ef92538a4dfb"

# ── Availability line shown on the home page ────────────────
availability: "Open for comic projects from 21 November 2026"

# ── Gallery ─────────────────────────────────────────────────
collections:
  works:
    output: false

defaults:
  - scope: { path: "" }
    values:
      layout: default
      image: /assets/img/brand/og-card.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - tools
