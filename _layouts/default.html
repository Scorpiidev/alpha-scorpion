<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
{% include head.html %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="sky" aria-hidden="true"></div>
  {% include header.html %}
  <main id="main" class="main wrap">
{{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {%- for s in page.scripts %}
  <script src="{{ s | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {%- endfor %}
</body>
</html>
