<footer class="foot">
  <div class="foot__inner">
    <a class="foot__heart" href="{{ '/' | relative_url }}" aria-label="Back to the top">{% include heart.svg %}</a>
    <p class="foot__motto">Per Tenebras, Forma <span>through darkness, form</span></p>
    <ul class="foot__links">
      {%- for s in site.data.socials %}
      <li><a href="{{ s.url }}" rel="noopener me" target="_blank">{{ s.name }}</a></li>
      {%- endfor %}
      <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
    </ul>
    <p class="foot__fine">© {{ site.time | date: '%Y' }} Antares · all artwork drawn by hand, no generative AI · please don't use it to train models</p>
  </div>
</footer>
