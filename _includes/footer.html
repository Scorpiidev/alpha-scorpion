<footer class="site-foot wrap">
  <div class="foot">
    <p>© {{ site.time | date: '%Y' }} Antares</p>
    <ul class="foot__links">
      {%- for s in site.data.socials %}
      <li><a href="{{ s.url }}" rel="noopener me" target="_blank">{{ s.name }}</a></li>
      {%- endfor %}
    </ul>
    <p class="foot__note">All artwork is drawn by hand, no generative AI. Please don't use it to train models.</p>
  </div>
</footer>
