# Comics on the home page, in this order.
# The page images live in assets/comics/<slug>/ (01.webp, 02.webp, ... and cover.webp).
# Make them from a PDF with:  python tools/comic_pages.py my-comic.pdf my-comic
- slug: universo-goya
  title: "Universo Goya"
  pages: 4
  language: Spanish
  note: "Contest runner-up, 2026"
  blurb: >-
    Eli can't see the point of her school project on Goya. Then her hearing-aid
    batteries die and she has to cross a city that has suddenly gone silent,
    and finds out how much she has in common with the deaf painter.

- slug: ammutindra
  title: "Ammutindra"
  pages: 8
  language: Spanish
  note: "Mutantes Paseantes contest"
  blurb: >-
    Cosmic horror. A research team accidentally kidnaps a juvenile divine entity,
    and her eldritch father comes down to take her back. Sumerian, Indian and
    Egyptian influences run through the designs.
